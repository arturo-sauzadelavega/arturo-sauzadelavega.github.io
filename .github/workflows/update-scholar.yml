name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes a las 6:00 UTC
  workflow_dispatch:       # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch citations
        run: python scripts/update_scholar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git diff --staged --quiet || (git commit -m "Update Google Scholar stats" && git push)
